<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grillbericht: SchärfeTaxi · incubateai Thinktank</title>
<style>
  :root {
    --bg: #14100d;
    --bg2: #1d1713;
    --panel: #231c17;
    --line: #3a2e25;
    --text: #f4ebe1;
    --muted: #b3a595;
    --ember: #ff6a1f;
    --ember2: #ffb347;
    --green: #2fbf71;
    --yellow: #f5c542;
    --red: #e5484d;
    --wood1: #5a3a24;
    --wood2: #3d2717;
    --radius: 14px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Georgia", "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.5; }
  body { background: radial-gradient(ellipse at 50% 0%, #2b1a10 0%, var(--bg) 60%) fixed; }
  a { color: var(--ember2); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  /* Kopf */
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; gap: 12px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; font-size: 20px; }
  .logo .flame { width: 28px; height: 28px; }
  .logo small { font-weight: 500; color: var(--muted); font-size: 13px; letter-spacing: 0; }
  .badge-draft { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1a1208; background: repeating-linear-gradient(45deg, var(--yellow) 0 10px, #e0b02f 10px 20px); padding: 6px 12px; border-radius: 999px; }

  /* Hero */
  .hero { text-align: center; padding: 18px 0 8px; }
  .kicker { color: var(--ember2); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
  .hero h1 { font-family: var(--serif); font-size: clamp(28px, 5vw, 48px); margin: 8px 0 6px; line-height: 1.1; }
  .hero p.pitch { color: var(--muted); max-width: 720px; margin: 0 auto; font-size: 17px; }
  .presenter { margin-top: 10px; font-size: 14px; color: var(--muted); }

  /* Bühne: Konferenztisch */
  .stage { position: relative; margin: 26px auto 0; width: 100%; max-width: 1040px; aspect-ratio: 16 / 10; }
  .table {
    position: absolute; left: 14%; right: 14%; top: 20%; bottom: 20%;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.08), transparent 60%),
      repeating-linear-gradient(100deg, var(--wood1) 0 14px, #4e321f 14px 22px, var(--wood2) 22px 30px);
    box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 0 0 10px #2a1a0f, inset 0 0 40px rgba(0,0,0,.6);
  }
  .grill {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 30%; aspect-ratio: 1.6; border-radius: 50%;
    background: radial-gradient(ellipse, #2a2a2a 0%, #111 70%);
    box-shadow: 0 0 0 6px #555, 0 0 0 9px #222, 0 10px 30px rgba(0,0,0,.7);
    overflow: visible; cursor: default;
  }
  .coals { position: absolute; inset: 14%; border-radius: 50%; background: radial-gradient(circle at 30% 40%, #ff8a3d 0 6%, transparent 7%), radial-gradient(circle at 60% 60%, #ff5a1a 0 7%, transparent 8%), radial-gradient(circle at 45% 70%, #ffae42 0 5%, transparent 6%), radial-gradient(circle at 70% 35%, #ff6a1f 0 6%, transparent 7%), radial-gradient(ellipse, #5a1d08 0%, #1a0a04 80%); filter: blur(1px); animation: glow 2.4s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .75; filter: blur(1px) brightness(.9); } to { opacity: 1; filter: blur(1.5px) brightness(1.3); } }
  .grate { position: absolute; inset: 8%; border-radius: 50%; background: repeating-linear-gradient(90deg, transparent 0 9%, rgba(180,180,180,.55) 9% 11%); }
  .dish {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 62%; padding: 8px 10px; text-align: center; border-radius: 12px;
    background: linear-gradient(160deg, #fff6e8, #f0dcc0); color: #3b2415;
    font-weight: 800; font-size: clamp(10px, 1.4vw, 15px); line-height: 1.15;
    box-shadow: 0 6px 16px rgba(0,0,0,.6);
  }
  .dish small { display: block; font-weight: 600; font-size: .72em; color: #8a5a36; margin-top: 2px; text-transform: uppercase; letter-spacing: .08em; }
  .smoke { position: absolute; left: 50%; bottom: 70%; width: 60%; height: 120%; transform: translateX(-50%); pointer-events: none; }
  .smoke span { position: absolute; bottom: 0; width: 26px; height: 26px; border-radius: 50%; background: rgba(230,220,210,.18); filter: blur(6px); animation: smoke 5s linear infinite; }
  .smoke span:nth-child(1) { left: 20%; animation-delay: 0s; }
  .smoke span:nth-child(2) { left: 45%; animation-delay: 1.4s; }
  .smoke span:nth-child(3) { left: 70%; animation-delay: 2.6s; }
  .smoke span:nth-child(4) { left: 35%; animation-delay: 3.6s; }
  @keyframes smoke { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-160px) translateX(20px) scale(2.4); opacity: 0; } }

  /* Plätze */
  .seat {
    position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%);
    width: 150px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0;
  }
  .seat:focus-visible { outline: 2px solid var(--ember2); outline-offset: 6px; border-radius: 12px; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--serif); font-size: 22px; font-weight: 700; color: #2a1a0f;
    background: radial-gradient(circle at 35% 30%, #f3e2c8, #c9a57b);
    box-shadow: 0 0 0 3px #1a120c, 0 0 0 5px var(--ring, #6b5443), 0 8px 18px rgba(0,0,0,.6);
    transition: box-shadow .4s, transform .2s;
  }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; filter: grayscale(1) contrast(1.05); display: block; }
  .seat:hover .avatar { transform: scale(1.06); }
  .seat.revealed .avatar { --ring: var(--c); }
  .nameplate { text-align: center; line-height: 1.2; }
  .nameplate b { display: block; font-size: 14px; }
  .nameplate span { font-size: 12px; color: var(--muted); }
  .tag-reserve { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ember2); }

  /* Karte mit Flip */
  .avatar-wrap { position: relative; }
  .card { position: absolute; top: -10px; left: calc(100% - 4px); width: 46px; height: 64px; perspective: 600px; }
  .seat.card-left .card { left: auto; right: calc(100% - 4px); }
  .card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,.8,.2,1.2); }
  .seat.revealed .card-inner { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; border-radius: 8px; backface-visibility: hidden; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(0,0,0,.5); }
  .card-back { background: repeating-linear-gradient(45deg, #2a1d14 0 6px, #33241a 6px 12px); border: 2px solid #4a3627; }
  .card-back svg { width: 26px; height: 26px; opacity: .8; }
  .card-front { transform: rotateY(180deg); background: var(--c); color: #111; font-weight: 900; font-size: 20px; line-height: 1; }
  .card-front small { font-size: 7px !important; margin-top: 3px; }
  .seat.revealed .card { animation: slam .8s ease-out; }
  @keyframes slam { 0% { transform: translateY(-18px) rotate(-8deg); } 60% { transform: translateY(2px) rotate(3deg); } 100% { transform: none; } }
  #results { opacity: 0; transform: translateY(12px); transition: opacity .8s, transform .8s; }
  #results.show { opacity: 1; transform: none; }
  .card-front small { display: block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; text-align: center; }

  .seat.chair .avatar { width: 72px; height: 72px; background: radial-gradient(circle at 35% 30%, #fff1d6, #d4a65f); }
  .gavel { font-size: 12px; color: var(--ember2); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }

  /* Steuerung */
  .controls { display: flex; justify-content: center; gap: 12px; margin: 10px 0 0; flex-wrap: wrap; }
  .btn { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, var(--ember), var(--ember2)); color: #1a0d05; box-shadow: 0 8px 24px rgba(255,106,31,.35); }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  /* Solange verdeckt: Button brennt, Pfeil zeigt drauf */
  .reveal-wrap { position: relative; display: inline-flex; flex-direction: column; align-items: center; }
  .nudge { position: absolute; bottom: 100%; margin-bottom: 6px; white-space: nowrap; color: var(--ember2); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; text-align: center; pointer-events: none; animation: nudge 1.1s ease-in-out infinite; }
  .nudge b { display: block; font-size: 22px; line-height: 1; }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
  .btn.lit { position: relative; animation: burn 1.4s ease-in-out infinite; }
  .btn.lit::before { content: "🔥"; margin-right: 8px; display: inline-block; animation: flicker .5s ease-in-out infinite alternate; }
  @keyframes burn {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,106,31,.7), 0 8px 24px rgba(255,106,31,.35); transform: scale(1); }
    50% { box-shadow: 0 0 0 10px rgba(255,106,31,0), 0 0 32px 6px rgba(255,160,60,.75); transform: scale(1.05); }
  }
  @keyframes flicker { from { transform: rotate(-8deg) scale(.95); } to { transform: rotate(6deg) scale(1.12); } }
  .reveal-wrap.done .nudge { display: none; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; }

  /* Anzeigetafel */
  .scoreboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 34px 0 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat .v { font-size: 32px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 13px; }
  .cards-mini { display: flex; justify-content: center; gap: 6px; margin-top: 4px; }
  .cards-mini i { width: 16px; height: 22px; border-radius: 3px; display: inline-block; }
  .scale { position: relative; height: 10px; border-radius: 999px; margin: 18px 0 4px; background: linear-gradient(90deg, var(--red) 0 39%, var(--yellow) 39% 69%, var(--green) 69% 100%); opacity: .9; }
  .scale .dot { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid #111; background: var(--text); }
  .scale .median { position: absolute; top: -8px; bottom: -8px; width: 3px; background: #fff; transform: translateX(-50%); }
  .scale-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

  /* Urteil */
  .verdict { margin: 30px 0 0; border-radius: 20px; padding: 26px; background: linear-gradient(135deg, #3a1f0e, #231710); border: 1px solid #5a3218; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
  .doneness { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; text-align: center; font-weight: 900; background: conic-gradient(var(--ember) calc(var(--p) * 1%), #3a2a20 0); position: relative; }
  .doneness::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #2a180d; }
  .doneness span { position: relative; z-index: 1; font-size: 15px; line-height: 1.1; }
  .doneness span small { display: block; font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
  .verdict h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 26px; }
  .verdict .rec { display: inline-block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: 999px; background: var(--yellow); color: #1a1208; margin-bottom: 8px; }
  .verdict blockquote { margin: 8px 0 0; font-family: var(--serif); font-style: italic; color: #f1d9c2; }

  /* Abschnitte */
  section.block { margin: 34px 0 0; }
  section.block > h3 { font-family: var(--serif); font-size: 22px; margin: 0 0 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .panel h4 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--ember2); }
  .panel ul, .panel ol { margin: 0; padding-left: 18px; }
  .panel li { margin: 6px 0; }
  .status { display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; border: 1px solid currentColor; }
  .s-Nutzerangabe { color: #8ecbff; } .s-Beleg { color: var(--green); } .s-Schluss { color: #c9b6ff; } .s-Annahme { color: var(--yellow); } .s-Offen { color: var(--red); }
  .objection { border-left: 4px solid var(--red); }
  .signal-ok { border-left: 4px solid var(--green); }
  .signal-stop { border-left: 4px solid var(--red); }

  .cta { margin: 40px 0; text-align: center; padding: 30px 20px; border-radius: 20px; background: radial-gradient(ellipse at 50% 0%, #4a230c, #221510); border: 1px solid #5a3218; }
  .cta h3 { font-family: var(--serif); font-size: 26px; margin: 0 0 6px; }
  .cta p { color: var(--muted); margin: 0 0 16px; }
  .disclaimer { color: var(--muted); font-size: 12px; text-align: center; margin: 0 0 24px; }
  .disclaimer a { color: inherit; }

  /* Fußzeile mit incubateai-Logo */
  .site-footer { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 0 40px; margin-top: 24px; border-top: 1px solid var(--line); }
  .site-footer .powered { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
  .incubate-logo { display: block; width: min(30vw, 110px); opacity: .9; transition: opacity .2s; }
  .incubate-logo:hover { opacity: 1; }
  .incubate-logo svg { display: block; width: 100%; height: auto; }

  /* Detail-Dialog */
  dialog { max-width: 640px; width: calc(100% - 32px); background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: 18px; padding: 0; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
  dialog::backdrop { background: rgba(10,6,4,.75); backdrop-filter: blur(3px); }
  .dlg-head { display: flex; gap: 16px; align-items: center; padding: 20px 22px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 22%, transparent), transparent); }
  .dlg-head .avatar { flex: none; }
  .dlg-head h3 { margin: 0; font-family: var(--serif); }
  .wiki-link { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--muted); }
  .wiki-link:hover { color: var(--ember2); border-bottom-color: var(--ember2); }
  .wiki-link span { font-size: .6em; margin-left: 4px; vertical-align: super; color: var(--muted); }
  .dlg-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .dlg-score { margin-left: auto; text-align: center; background: var(--c); color: #111; border-radius: 10px; padding: 6px 12px; font-weight: 900; font-size: 26px; line-height: 1; }
  .dlg-score small { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .dlg-body { padding: 18px 22px 22px; }
  .dlg-body h4 { margin: 16px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ember2); }
  .dlg-body p { margin: 0; }
  .kernsatz { font-family: var(--serif); font-size: 19px; font-style: italic; }
  .dlg-close { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--muted); font-size: 24px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* Mobil: Tisch wird zur Liste rund um den Grill */
  @media (max-width: 760px) {
    .stage { aspect-ratio: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 10px; padding-top: 190px; }
    .table { left: 0; right: 0; top: 0; bottom: auto; height: 170px; border-radius: 40%; }
    .grill { top: 85px; width: 62%; }
    .seat { position: static; transform: none; width: auto; }
    .seat.chair { grid-column: 1 / -1; }
    .scoreboard { grid-template-columns: 1fr 1fr; }
    .grid2, .grid3 { grid-template-columns: 1fr; }
    .verdict { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  }
</style>
</head>

<!-- GoatCounter: Pfad = /thinktank/<ideen-slug>. allow_local, weil der Bericht meist lokal als Datei geöffnet wird. -->
<script data-goatcounter="https://m-dohmen.goatcounter.com/count"
        data-goatcounter-settings='{"allow_local": true, "path": "/thinktank/schaerfetaxi", "title": "Thinktank: SchärfeTaxi"}'
        async src="https://gc.zgo.at/count.js"></script>
<noscript>
    <img src="https://m-dohmen.goatcounter.com/count?p=/thinktank/schaerfetaxi" alt="">
</noscript>

<script>
(function () {
  const D = JSON.parse(document.getElementById('thinktank-data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Karte aus Score: 70–100 grün, 40–69 gelb, 1–39 rot
  const cardOf = (s) => s >= 70 ? { key: 'gruen', label: 'Grün', c: 'var(--green)' }
    : s >= 40 ? { key: 'gelb', label: 'Gelb', c: 'var(--yellow)' }
    : { key: 'rot', label: 'Rot', c: 'var(--red)' };
  const bandOf = (s) => s >= 80 ? 'stark' : s >= 60 ? 'tragfähig mit Auflagen' : s >= 40 ? 'ungeprüft' : s >= 20 ? 'schwach' : 'ungeeignet';
  const median = (a) => { const b = [...a].sort((x, y) => x - y); const m = b.length >> 1; return b.length % 2 ? b[m] : Math.round((b[m - 1] + b[m]) / 2); };
  const recLabel = { 'freigeben': 'Freigeben', 'freigeben-mit-auflagen': 'Freigeben mit Auflagen', 'überarbeiten': 'Überarbeiten', 'verwerfen': 'Verwerfen', 'vertagt': 'Vertagt' };
  const recColor = { 'freigeben': 'var(--green)', 'freigeben-mit-auflagen': 'var(--green)', 'überarbeiten': 'var(--yellow)', 'verwerfen': 'var(--red)', 'vertagt': 'var(--muted)' };

  // Porträt als Data-URI (nur data:image/ zulassen), sonst Initialen
  const face = (p) => /^data:image\/(webp|jpeg|png);base64,/.test(p.portrait || '')
    ? `<img src="${p.portrait}" alt="Porträt ${esc(p.name)}">` : esc(p.initialen);

  const cardBack = '<svg viewBox="0 0 24 24"><path fill="#ff8a3d" d="M12 2c1 3.5 5 5.5 5 11a5 5 0 0 1-10 0c0-2.3 1-3.8 2.2-5 .2 1.6 1 2.6 2 3-.6-3 .3-6.3.8-9z"/></svg>';

  // Kopf
  $('draft-badge').hidden = !D.meta?.entwurf;
  $('idea-title').textContent = D.idee.titel;
  $('idea-pitch').textContent = D.idee.pitch;
  const files = D.idee.kontextdateien?.length ? ` · Kontext: ${D.idee.kontextdateien.join(', ')}` : '';
  $('idea-presenter').textContent = `Vorgetragen von ${D.idee.vortragende}${files}`;
  $('dish').innerHTML = `${esc(D.idee.titel)}<small>${esc(D.idee.untertitel || '')}</small>`;

  // Sitzordnung: Vorsitz oben, Rat im Oval darum (5–7 Plätze gleichmäßig von -38° bis 218°)
  const stage = $('stage');
  const n = D.rat.length;
  const angles = D.rat.map((_, i) => n > 1 ? -38 + i * 256 / (n - 1) : 90);
  const pos = (deg) => { const r = deg * Math.PI / 180; return { x: 50 + 44 * Math.cos(r), y: 50 + 41 * Math.sin(r) }; };

  const chair = document.createElement('button');
  chair.className = 'seat chair';
  chair.style.setProperty('--x', '50%'); chair.style.setProperty('--y', '8%');
  chair.innerHTML = `<div class="avatar-wrap"><div class="avatar" style="--ring:var(--ember2)">${face(D.vorsitz)}</div></div>
    <div class="nameplate"><b>${esc(D.vorsitz.name)}</b><span class="gavel">${esc(D.vorsitz.rolle)}</span></div>`;
  chair.addEventListener('click', () => openChair());
  stage.appendChild(chair);

  const seats = D.rat.map((m, i) => {
    const p = pos(angles[i]);
    const card = cardOf(m.score);
    const el = document.createElement('button');
    el.className = 'seat' + (p.x > 50 ? ' card-left' : '');
    el.style.setProperty('--x', p.x + '%'); el.style.setProperty('--y', p.y + '%');
    el.style.setProperty('--c', card.c);
    el.setAttribute('aria-label', `${m.name}, ${m.rolle}: Votum anzeigen`);
    el.innerHTML = `<div class="avatar-wrap"><div class="avatar">${face(m)}</div>
        <div class="card"><div class="card-inner">
          <div class="card-face card-back">${cardBack}</div>
          <div class="card-face card-front"><div>${m.score}<small>${card.label}</small></div></div>
        </div></div></div>
      <div class="nameplate">${m.reserve ? '<div class="tag-reserve">Reserve</div>' : ''}<b>${esc(m.name)}</b><span>${esc(m.rolle)}</span></div>`;
    el.addEventListener('click', () => openMember(m));
    stage.appendChild(el);
    return el;
  });

  // Ergebnisse
  const scores = D.rat.map((m) => m.score);
  const med = median(scores);
  const min = Math.min(...scores), max = Math.max(...scores);
  const outliers = D.rat.filter((m) => Math.abs(m.score - med) >= 20);
  const E = D.entscheidung;
  const counts = { gruen: 0, gelb: 0, rot: 0 };
  scores.forEach((s) => counts[cardOf(s).key]++);
  const mini = D.rat.map((m) => `<i style="background:${cardOf(m.score).c}" title="${esc(m.name)}: ${m.score}"></i>`).join('');
  const st = (s) => `<span class="status s-${esc(s)}">${esc(s)}</span>`;

  $('results').innerHTML = `
    <div class="scoreboard">
      <div class="stat"><div class="v">${med}</div><div class="l">Median · ${esc(bandOf(med))}</div></div>
      <div class="stat"><div class="v">${min}–${max}</div><div class="l">Spannweite (${max - min} Punkte)</div></div>
      <div class="stat"><div class="cards-mini">${mini}</div><div class="l" style="margin-top:8px">${counts.gruen}× Grün · ${counts.gelb}× Gelb · ${counts.rot}× Rot</div></div>
      <div class="stat"><div class="v">${outliers.length}</div><div class="l">Ausreißer${outliers.length ? ': ' + outliers.map((o) => esc(o.name.split(' ').pop())).join(', ') : ''}</div></div>
    </div>
    <div class="scale" aria-hidden="true">
      ${D.rat.map((m) => `<span class="dot" style="left:${m.score}%;background:${cardOf(m.score).c}" title="${esc(m.name)}: ${m.score}"></span>`).join('')}
      <span class="median" style="left:${med}%" title="Median ${med}"></span>
    </div>
    <div class="scale-legend"><span>1 · Rot</span><span>40 · Gelb</span><span>70 · Grün</span><span>100</span></div>

    <div class="verdict">
      <div class="doneness" style="--p:${E.garfortschritt}"><span>${esc(E.garstufe)}<small>Garstufe</small></span></div>
      <div>
        <span class="rec" style="background:${recColor[E.empfehlung]}">Empfehlung: ${esc(recLabel[E.empfehlung] || E.empfehlung)}</span>
        <h2>${esc(E.kurzurteil)}</h2>
        <blockquote>„${esc(D.vorsitz.urteil)}“<br><small>– ${esc(D.vorsitz.name)}, Vorsitz</small></blockquote>
      </div>
    </div>

    <section class="block">
      <h3>Was der Rat sagt</h3>
      <div class="grid2">
        <div class="panel"><h4>Konsens</h4><ul>${E.konsens.map((k) => `<li>${esc(k)}</li>`).join('')}</ul></div>
        <div class="panel"><h4>Dissens</h4><ul>${E.dissens.map((k) => `<li>${esc(k)}</li>`).join('')}</ul></div>
      </div>
      <div class="panel objection" style="margin-top:14px"><h4>Stärkster Einwand · ${esc(E.staerksterEinwand.von)}</h4><p style="margin:0">${esc(E.staerksterEinwand.text)}</p></div>
    </section>

    <section class="block">
      <h3>Die riskantesten Annahmen</h3>
      <div class="grid3">${E.annahmen.map((a, i) => `<div class="panel"><h4>Annahme ${i + 1}</h4>${st(a.status)}<p style="margin:6px 0 0">${esc(a.text)}</p></div>`).join('')}</div>
    </section>

    <section class="block">
      <h3>Dein nächstes Gespräch</h3>
      <div class="panel"><h4>Mit wem</h4><p style="margin:0 0 12px">${esc(E.gespraech.mitWem)}</p>
        <h4>Fragen</h4><ol>${E.gespraech.fragen.map((f) => `<li>${esc(f)}</li>`).join('')}</ol></div>
    </section>

    <section class="block">
      <h3>7-Tage-Test</h3>
      <div class="panel"><h4>Frage</h4><p style="margin:0 0 12px">${esc(E.test.ziel)}</p>
        <h4>Ablauf</h4><ul>${E.test.schritte.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></div>
      <div class="grid2" style="margin-top:14px">
        <div class="panel signal-ok"><h4>Weitermachen, wenn</h4><p style="margin:0">${esc(E.test.erfolg)}</p></div>
        <div class="panel signal-stop"><h4>Abbrechen, wenn</h4><p style="margin:0">${esc(E.test.abbruch)}</p></div>
      </div>
    </section>

    <section class="block">
      <h3>Noch offen</h3>
      <div class="panel"><ul>${E.offen.map((o) => `<li>${st('Offen')}${esc(o)}</li>`).join('')}</ul></div>
    </section>

    <div class="cta">
      <h3>Bereit für die volle Grillrunde?</h3>
      <p>Der Light-Rat gibt eine erste Einschätzung. Der First Grill auf grillmyidea.eu prüft tiefer, mit Quellen und Gesprächsreife-Dossier.</p>
      <a class="btn btn-primary" href="https://grillmyidea.eu" target="_blank" rel="noopener" data-goatcounter-click="cta-grillmyidea">Zu grillmyidea.eu</a>
    </div>
    <p class="disclaimer">Die Personen sind KI-Rollen nach historischen Vorbildern, keine echten Aussagen. Der Bericht ersetzt keine Rechts-, Steuer- oder Finanzberatung und ist kein Urteil über den Erfolg der Idee. ${esc(D.meta?.produkt || '')} · ${esc(D.meta?.datum || '')}${D.meta?.bildnachweis ? `<br>${/^https:\/\//.test(D.meta.bildnachweisUrl || '') ? `<a href="${esc(D.meta.bildnachweisUrl)}" target="_blank" rel="noopener">${esc(D.meta.bildnachweis)}</a>` : esc(D.meta.bildnachweis)}` : ''}</p>
  `;

  // Detail-Dialog
  const dlg = $('dlg');
  // Name im Dialog verlinkt auf Wikipedia (neuer Tab), nur https-Links aus den Daten
  const nameLink = (p) => /^https:\/\//.test(p.wikipedia || '')
    ? `<a class="wiki-link" href="${esc(p.wikipedia)}" target="_blank" rel="noopener" title="Wikipedia-Artikel in neuem Tab" data-goatcounter-click="wiki-${esc(p.id)}">${esc(p.name)}<span aria-hidden="true">↗</span></a>`
    : esc(p.name);
  const ups = (m) => m.upvotes || (m.upvote ? [m.upvote] : []);
  function openMember(m) {
    const card = cardOf(m.score);
    dlg.style.setProperty('--c', card.c);
    $('dlg-content').innerHTML = `
      <div class="dlg-head"><div class="avatar" style="--ring:${card.c}">${face(m)}</div>
        <div><h3>${nameLink(m)}</h3><p>${esc(m.rolle)}${m.lebensdaten ? ' · ' + esc(m.lebensdaten) : ''}${m.reserve ? ' · Reserve' : ''}</p></div>
        <div class="dlg-score">${m.score}<small>${card.label}</small></div></div>
      <div class="dlg-body">
        <p class="kernsatz">„${esc(m.kernsatz)}“</p>
        <h4>Einordnung</h4><p>${esc(bandOf(m.score))} · Konfidenz ${esc(m.konfidenz)}</p>
        <h4>Prüfung</h4><p>${esc(m.pruefung)}</p>
        <h4>Stärkster Einwand</h4><p>${esc(m.einwand)}</p>
        ${ups(m).length ? `<h4>So wird die Karte besser</h4>${ups(m).map((u) => `<p><b>+${esc(u.plus)} → ${esc(u.neu)}</b>, wenn ${esc(u.wenn)}.</p>`).join('')}` : ''}
        ${m.auflagen?.length ? `<h4>Auflagen</h4><ul>${m.auflagen.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
      </div>`;
    dlg.showModal();
  }
  function openChair() {
    dlg.style.setProperty('--c', 'var(--ember2)');
    $('dlg-content').innerHTML = `
      <div class="dlg-head"><div class="avatar" style="--ring:var(--ember2)">${face(D.vorsitz)}</div>
        <div><h3>${nameLink(D.vorsitz)}</h3><p>${esc(D.vorsitz.rolle)}</p></div></div>
      <div class="dlg-body"><p class="kernsatz">„${esc(D.vorsitz.urteil)}“</p>
        <h4>Empfehlung</h4><p>${esc(recLabel[E.empfehlung] || E.empfehlung)}</p></div>`;
    dlg.showModal();
  }
  $('dlg-close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

  // Aufdecken: eine Karte nach der anderen, danach Ergebnisse
  let timers = [];
  function reveal() {
    reset();
    markRevealed();
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const step = reduced ? 0 : 750;
    seats.forEach((s, i) => timers.push(setTimeout(() => s.classList.add('revealed'), 400 + i * step)));
    timers.push(setTimeout(() => $('results').classList.add('show'), 400 + seats.length * step + 300));
  }
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    seats.forEach((s) => s.classList.remove('revealed'));
    $('results').classList.remove('show');
  }
  // Nach dem ersten Aufdecken: kein Feuer, kein Pfeil mehr
  function markRevealed() {
    $('btn-reveal').classList.remove('lit');
    $('btn-reveal').textContent = 'Nochmal aufdecken';
    $('reveal-wrap').classList.add('done');
  }
  $('btn-reveal').addEventListener('click', reveal);
  $('btn-reset').addEventListener('click', openRegrill);

  // "Nochmal grillen": Hinweis auf Light-Skill statt Neustart im Bericht
  function openRegrill() {
    dlg.style.setProperty('--c', 'var(--ember)');
    $('dlg-content').innerHTML = `
      <div class="dlg-head"><div class="avatar" style="--ring:var(--ember)">🔥</div>
        <div><h3>Nochmal auf den Grill?</h3><p>Dies ist der Light-Skill des incubateai Thinktanks</p></div></div>
      <div class="dlg-body">
        <p>Dieser Bericht ist ein fertiger Abzug. Für eine neue Runde, etwa mit einer überarbeiteten Idee oder neuen Kontextdateien, lass am besten direkt in deinem Chatbot eine neue Bewertung erstellen.</p>
        <h4>Noch besserer Griller werden?</h4>
        <p>Dann empfehlen wir dir die tiefen Bewertungsrunden auf grillmyidea.eu: mit Quellenprüfung, Gesprächsreife-Dossier und zweiter Grillrunde.</p>
        <div class="controls" style="justify-content:flex-start;margin-top:18px">
          <a class="btn btn-primary" href="https://grillmyidea.eu" target="_blank" rel="noopener" data-goatcounter-click="regrill-grillmyidea">Zu grillmyidea.eu</a>
          <button class="btn btn-ghost" id="regrill-close">Verstanden</button>
        </div>
      </div>`;
    $('regrill-close').addEventListener('click', () => dlg.close());
    if (window.goatcounter?.count) window.goatcounter.count({ path: 'nochmal-grillen', title: 'Nochmal grillen', event: true });
    dlg.showModal();
  }
  if (new URLSearchParams(location.search).has('aufgedeckt')) {
    seats.forEach((s) => s.classList.add('revealed'));
    $('results').classList.add('show');
    markRevealed();
  }
})();
</script>
</body>
</html>
